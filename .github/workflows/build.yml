name: Build AIX Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Rush CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/shreyashsaitwal/rush-cli/main/scripts/install/install.sh | bash
          echo "$HOME/.rush/bin" >> $GITHUB_PATH

      - name: Initialize and Build Extension
        run: |
          mkdir -p my_extension && cd my_extension
          $HOME/.rush/bin/rush create DeeplinkExtension --org com.deeplink.app --no-input
          cd DeeplinkExtension
          $HOME/.rush/bin/rush build

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-AIX
          path: my_extension/DeeplinkExtension/out/*.aix
